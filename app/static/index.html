<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PD2 Asset Studio</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>PD2 Asset Studio</h1>
  <div class="game" id="gameStatus">game: checking…</div>
  <div class="game" id="meshyStatus">meshy: …</div>
  <div class="actions">
    <a href="/pairing"><button title="Review and pair your Meshy generations with catalog items, side by side">⇄ Pair Meshy</button></a>
    <button id="pushBtn" title="Build patch.mpq from your active choices and register it in the running game">Push to game</button>
    <button id="reloadBtn" title="Soft reload: exit to menu &amp; re-enter (fast; may not refresh already-loaded art)">Soft reload</button>
    <button id="fullReloadBtn" title="Full reload: relaunch a fresh game process (1 UAC) + register + enter — guaranteed-clean art (~60-90s)">Full reload</button>
  </div>
</header>

<div class="toolbar">
  <input id="search" type="search" placeholder="Search items by name or code…">
  <span id="count" class="count"></span>
</div>

<main>
  <div class="gridcol">
    <div class="colhead">1 · Gallery</div>
    <section id="grid" class="grid"></section>
  </div>
  <aside id="detail" class="detail hidden"></aside>
  <aside id="workflow" class="workflow-panel hidden"></aside>
</main>

<div id="toast" class="toast hidden"></div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module" src="/static/workflow3d.js"></script>
<script src="/static/provbox.js"></script>
<script src="/static/adjpanel.js"></script>
<script src="/static/workflow.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
